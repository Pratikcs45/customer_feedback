<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Customer Feedback</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            Customer Feedback
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to submit your feedback
        </p>

        <div id="errorMessage" class="alert error hidden"></div>

        <div id="successMessage" class="alert success hidden"></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        required
                >

            </div>

            <button
                    type="submit"
                    class="btn btn-primary"
                    id="registerButton"
            >
                Sign Up
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

</body>
</html>
