<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Customer Feedback</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            Customer Feedback
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <div id="errorMessage" class="alert error hidden"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                >

            </div>

            <button
                    type="submit"
                    class="btn btn-primary"
                    id="loginButton"
            >
                Login
            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="/register.html">
                Sign Up
            </a>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

</body>
</html>
