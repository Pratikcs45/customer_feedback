<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="nav-brand">
        Customer Feedback
    </div>

    <div class="nav-actions">

        <span
                id="usernameDisplay"
                class="username"
        ></span>

        <span class="role-badge admin">
            ADMIN
        </span>

        <button
                class="btn btn-outline"
                id="logoutButton"
        >
            Logout
        </button>

    </div>

</nav>


<main class="page">

    <div class="container-wide">

        <div class="page-title">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage customer feedback
            </p>

        </div>


        <div
                id="errorMessage"
                class="alert error hidden"
        ></div>

        <div
                id="successMessage"
                class="alert success hidden"
        ></div>


        <!-- EDIT -->

        <section
                id="editSection"
                class="card hidden"
        >

            <div class="card-header">

                <div>

                    <h2>
                        Edit Feedback
                    </h2>

                    <p class="card-subtitle">
                        Update selected feedback
                    </p>

                </div>

                <button
                        id="cancelEditButton"
                        class="btn btn-light"
                >
                    Cancel
                </button>

            </div>


            <form id="editForm">

                <div class="form-group">

                    <label for="editFeedback">
                        Feedback
                    </label>

                    <textarea
                            id="editFeedback"
                            rows="6"
                            required
                    ></textarea>

                </div>


                <button
                        type="submit"
                        class="btn btn-primary"
                        id="updateButton"
                >
                    Update Feedback
                </button>

            </form>

        </section>


        <!-- TABLE -->

        <section class="card table-card">

            <div class="table-header">

                <div>

                    <h2>
                        All Feedback
                    </h2>

                    <p class="card-subtitle">
                        View, edit or delete feedback
                    </p>

                </div>

                <span
                        id="recordCount"
                        class="record-count"
                >
                    0 records
                </span>

            </div>


            <div
                    id="tableLoading"
                    class="loading"
            >
                Loading feedback...
            </div>


            <div
                    id="tableContainer"
                    class="table-responsive hidden"
            >

                <table>

                    <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            User
                        </th>

                        <th>
                            Feedback
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody
                            id="feedbackTableBody"
                    >
                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>


<!-- VIEW MODAL -->

<div
        id="viewModal"
        class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <div>

                <h2>
                    Feedback Details
                </h2>

            </div>

            <button
                    id="closeModalButton"
                    class="modal-close"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="detail-row">

                <span>
                    Feedback ID
                </span>

                <strong id="modalId"></strong>

            </div>


            <div class="detail-row">

                <span>
                    User
                </span>

                <strong id="modalUser"></strong>

            </div>


            <div class="detail-row">

                <span>
                    Date
                </span>

                <strong id="modalDate"></strong>

            </div>


            <div class="modal-feedback">

                <span>
                    Feedback
                </span>

                <p id="modalFeedback"></p>

            </div>

        </div>

    </div>

</div>


<script src="/js/admin.js"></script>

</body>

</html>
